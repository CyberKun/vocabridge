[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vocabridge"
version = "0.1.0"
description = "Turn tabular data into a validated knowledge graph by reusing existing vocabularies, with every AI or heuristic mapping treated as a reviewable hypothesis."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Suchismita Sahu" }]
keywords = ["ontology", "knowledge-graph", "rdf", "shacl", "semantic-web", "data-mapping", "vocabulary-reuse"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Intended Audience :: Developers",
]
dependencies = [
  "rdflib>=7.0",
  "pyshacl>=0.26",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
vocabridge = "vocabridge.cli:main"

[project.urls]
Homepage = "https://github.com/Suchi-BITS/vocabridge"
Issues = "https://github.com/Suchi-BITS/vocabridge/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
